name: Postman API Tests Reporting to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  schedule:
    # Runs every 8 hours
    - cron: "0 */8 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Newman tests
        continue-on-error: true
        run: |
          mkdir -p ./gh-pages/api
          npx newman run "postman-collection/groq.postman_collection.json" \
            -e "postman-collection/groq.postman_environment.json" \
            --env-var "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" \
            --verbose \
            -r htmlextra \
            --reporter-htmlextra-export "./gh-pages/api/index.html" \
            --reporter-htmlextra-title "Groq LLM API Test Report" \
            --reporter-htmlextra-skipEnvironmentVars GROQ_API_KEY \
            --reporter-htmlextra-skipHeaders Authorization \
            --reporter-htmlextra-displayProgressBar

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ./gh-pages

  deploy:
    needs: api-tests
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}api/

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
